<script>
  const API_URL =
    'https://script.google.com/macros/s/AKfycbz8syGgDfKmZJPnl3Oqgf0P85ayqqGDdz6K3fQC4Wy8OjbO1tXusOl9DPa5nf0ewC-m/exec';

  const REPORT_URL =
    API_URL + '?page=dashboard';

  document.getElementById('report-btn').href =
    REPORT_URL;

  document.getElementById('charge-date').value =
    new Date().toISOString().split('T')[0];

  let stationsData = [];
  let currentRate = null;
  let priceManuallyEdited = false;

  loadStations();

  async function loadStations() {

    try {

      const response =
        await fetch(
          `${API_URL}?action=getStations`
        );

      const result =
        await response.json();

      stationsData =
        result.data || [];

      const select =
        document.getElementById('station');

      while (select.options.length > 1) {
        select.remove(1);
      }

      stationsData.forEach(function (s) {

        const opt =
          document.createElement('option');

        opt.value = s.name;
        opt.textContent = s.name;

        select.add(opt);
      });

      const newOpt =
        document.createElement('option');

      newOpt.value = '__new__';
      newOpt.textContent =
        '+ เพิ่มสถานีใหม่...';

      select.add(newOpt);

    } catch (error) {

      console.error(
        'loadStations error',
        error
      );
    }
  }

  function handleStationChange() {

    const val =
      document.getElementById('station')
        .value;

    const custom =
      document.getElementById(
        'station-custom'
      );

    if (val === '__new__') {

      custom.style.display = 'block';
      custom.focus();

    } else {

      custom.style.display = 'none';
      custom.value = '';
    }

    currentRate = null;
    priceManuallyEdited = false;

    document
      .getElementById('btn-onpeak')
      .classList.remove('active');

    document
      .getElementById('btn-offpeak')
      .classList.remove('active');

    document
      .getElementById('rate-info')
      .style.display = 'none';

    document
      .getElementById('peak-toggle')
      .style.display = 'none';

    const station =
      stationsData.find(function (x) {
        return x.name === val;
      });

    if (!station) return;

    const hasBoth =
      station.onPeak &&
      station.offPeak;

    if (hasBoth) {

      document
        .getElementById(
          'peak-toggle'
        )
        .style.display = 'flex';

    } else if (
      station.singlePrice
    ) {

      currentRate =
        station.singlePrice;

      document
        .getElementById(
          'rate-value'
        )
        .textContent =
        currentRate.toFixed(2);

      document
        .getElementById(
          'rate-info'
        )
        .style.display =
        'block';

      autoFillPrice();
    }
  }

  function setPeak(type) {

    const val =
      document.getElementById(
        'station'
      ).value;

    const station =
      stationsData.find(
        x => x.name === val
      );

    if (!station) return;

    currentRate =
      type === 'on'
        ? station.onPeak
        : station.offPeak;

    priceManuallyEdited = false;

    document
      .getElementById(
        'btn-onpeak'
      )
      .classList.toggle(
        'active',
        type === 'on'
      );

    document
      .getElementById(
        'btn-offpeak'
      )
      .classList.toggle(
        'active',
        type === 'off'
      );

    if (currentRate) {

      document
        .getElementById(
          'rate-value'
        )
        .textContent =
        currentRate.toFixed(2);

      document
        .getElementById(
          'rate-info'
        )
        .style.display =
        'block';

      autoFillPrice();
    }
  }

  function priceEdited() {

    priceManuallyEdited = true;
    calcTotal();
  }

  function autoFillPrice() {

    if (
      !currentRate ||
      priceManuallyEdited
    ) {
      return;
    }

    const kwh =
      parseFloat(
        document.getElementById(
          'kwh'
        ).value
      ) || 0;

    if (kwh > 0) {

      document.getElementById(
        'price'
      ).value =
        (
          currentRate * kwh
        ).toFixed(2);

      calcTotal();
    }
  }

  function calcTotal() {

    const price =
      parseFloat(
        document.getElementById(
          'price'
        ).value
      ) || 0;

    const discount =
      parseFloat(
        document.getElementById(
          'discount'
        ).value
      ) || 0;

    const kwh =
      parseFloat(
        document.getElementById(
          'kwh'
        ).value
      ) || 0;

    const final =
      Math.max(
        0,
        price - discount
      );

    document
      .getElementById(
        'final-price'
      )
      .textContent =
      '฿ ' + final.toFixed(2);

    if (kwh > 0) {

      document
        .getElementById(
          'baht-kwh'
        )
        .textContent =
        (
          final / kwh
        ).toFixed(2) +
        ' บาท/kWh';

    } else {

      document
        .getElementById(
          'baht-kwh'
        )
        .textContent =
        '- บาท/kWh';
    }
  }

  async function handleSubmit() {

    const date =
      document.getElementById(
        'charge-date'
      ).value;

    const selectEl =
      document.getElementById(
        'station'
      );

    const station =
      selectEl.value ===
      '__new__'
        ? document
            .getElementById(
              'station-custom'
            )
            .value.trim()
        : selectEl.value;

    const price =
      parseFloat(
        document.getElementById(
          'price'
        ).value
      );

    const kwh =
      parseFloat(
        document.getElementById(
          'kwh'
        ).value
      );

    if (
      !date ||
      !station ||
      isNaN(price) ||
      isNaN(kwh)
    ) {

      alert(
        'กรุณากรอกข้อมูลให้ครบ'
      );

      return;
    }

    if (kwh <= 0) {

      alert('kWh ต้องมากกว่า 0');

      return;
    }

    const discount =
      parseFloat(
        document.getElementById(
          'discount'
        ).value
      ) || 0;

    const finalPrice =
      Math.max(
        0,
        price - discount
      );

    const bahtPerKwh =
      kwh > 0
        ? parseFloat(
            (
              finalPrice /
              kwh
            ).toFixed(2)
          )
        : 0;

    const trip =
      document
        .getElementById(
          'trip'
        )
        .value.trim();

    const payload = {
      date,
      station,
      trip,
      priceBeforeDiscount:
        price,
      kwh,
      discount,
      finalPrice,
      bahtPerKwh
    };

    const btn =
      document.getElementById(
        'submit-btn'
      );

    try {

      btn.disabled = true;
      btn.innerHTML =
        'กำลังบันทึก...';

      const response =
        await fetch(API_URL, {
          method: 'POST',
          headers: {
            'Content-Type':
              'application/json'
          },
          body:
            JSON.stringify(
              payload
            )
        });

      const result =
        await response.json();

      if (
        !result.success
      ) {
        throw new Error(
          result.message
        );
      }

      document
        .getElementById(
          'toast'
        )
        .style.display =
        'block';

      document
        .getElementById(
          'error'
        )
        .style.display =
        'none';

      setTimeout(
        () =>
          (
            document.getElementById(
              'toast'
            ).style.display =
              'none'
          ),
        3000
      );

      resetForm();

    } catch (err) {

      console.error(err);

      document
        .getElementById(
          'error'
        )
        .style.display =
        'block';

      document
        .getElementById(
          'toast'
        )
        .style.display =
        'none';

      setTimeout(() => {

        document
          .getElementById(
            'error'
          )
          .style.display =
          'none';

      }, 4000);

    } finally {

      btn.disabled = false;

      btn.innerHTML =
        `
        <svg width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="white"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        บันทึกการชาร์จ
      `;
    }
  }

  function resetForm() {

    document
      .getElementById(
        'station'
      )
      .selectedIndex = 0;

    document
      .getElementById(
        'station-custom'
      )
      .style.display =
      'none';

    document
      .getElementById(
        'station-custom'
      )
      .value = '';

    document
      .getElementById(
        'peak-toggle'
      )
      .style.display =
      'none';

    document
      .getElementById(
        'rate-info'
      )
      .style.display =
      'none';

    document
      .getElementById(
        'btn-onpeak'
      )
      .classList.remove(
        'active'
      );

    document
      .getElementById(
        'btn-offpeak'
      )
      .classList.remove(
        'active'
      );

    currentRate = null;
    priceManuallyEdited = false;

    document
      .getElementById(
        'trip'
      )
      .value = '';

    document
      .getElementById(
        'price'
      )
      .value = '';

    document
      .getElementById(
        'kwh'
      )
      .value = '';

    document
      .getElementById(
        'discount'
      )
      .value = '';

    document
      .getElementById(
        'charge-date'
      )
      .value =
      new Date()
        .toISOString()
        .split('T')[0];

    calcTotal();
  }
</script>
